<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <title>{{ site.title }} | {{ site.affiliation }}</title>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.title }}">
    {% if site.keywords %}
    <meta name="keywords" content="{{ site.keywords }}">
    {% endif %}
    {% if site.canonical %}
    <link rel="canonical" href="{{ site.canonical }}"/>
    {% endif %}

    <!-- One mark for every context: the accent ground reads on light and dark
         chrome alike. ?v= is bumped on edit, because browsers cache favicons
         far more stubbornly than they cache pages. -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/img/favicon.png" | relative_url }}?v={{ site.favicon_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/img/apple-touch-icon.png" | relative_url }}?v={{ site.favicon_version }}">
    <link rel="alternate icon" href="{{ "/favicon.ico" | relative_url }}?v={{ site.favicon_version }}">

    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">

    <!-- Applied before first paint so a dark-mode visitor never sees a light flash. -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('darkMode'); } catch (e) {}
        var dark = stored === null
          ? {% if site.auto_dark_mode %}window.matchMedia('(prefers-color-scheme: dark)').matches{% else %}false{% endif %}
          : stored === 'true';
        if (dark) document.documentElement.setAttribute('data-initial-dark', 'true');
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="wrapper">
      <div class="navbar container">
        <a id="author-name" class="alignable pull-left" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <ul id="navlist" class="alignable pull-right navbar-ul">
          <li class="alignable pull-left nav-list">
            <div class="toggle-switch">
              <input type="checkbox" id="darkModeToggle" class="toggle-input" aria-label="Toggle dark mode">
              <label for="darkModeToggle" class="toggle-label">
                <span class="toggle-slider"></span>
              </label>
            </div>
          </li>
        </ul>
      </div>
      <div style="clear:both"></div>

      <main id="main" class="container content">
        {{ content }}

        {% if site.enable_footnote %}
        <footer class="site-footer">
          Powered by Jekyll. Theme based on <a href="https://manishs.org/" target="_blank" rel="noopener">manishs.org</a>
        </footer>
        {% endif %}
      </main>
    </div>

    <script>
      (function () {
        var toggle = document.getElementById('darkModeToggle');
        var dark = document.documentElement.getAttribute('data-initial-dark') === 'true';

        if (dark) document.body.classList.add('dark-mode');
        if (toggle) {
          toggle.checked = dark;
          toggle.addEventListener('change', function () {
            document.body.classList.toggle('dark-mode', this.checked);
            try { localStorage.setItem('darkMode', this.checked ? 'true' : 'false'); } catch (e) {}
          });
        }
      })();
    </script>
    <script defer src="{{ "/assets/js/news-fit.js" | relative_url }}"></script>
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
  </body>
</html>
